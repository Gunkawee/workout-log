<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e12">
<title>สมุดบันทึกเวท</title>
<style>
  :root { --bg:#0b0e12; --card:#151a21; --card2:#1c232c; --line:#262f3a; --txt:#eef2f6; --mut:#8793a1; --acc:#3ddc97; --acc2:#19b9a6; --accfg:#032416; --warn:#f2b84b; --r:18px; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body { margin:0; background:radial-gradient(900px 400px at 50% -120px,#13303a 0,transparent 70%),var(--bg); color:var(--txt); font:16px/1.45 system-ui,-apple-system,"Sarabun",sans-serif; padding-bottom:calc(92px + env(safe-area-inset-bottom)); }
  main { max-width:560px; margin:0 auto; padding:14px 14px 8px; }
  h1 { margin:0; font-size:26px; line-height:1.15; letter-spacing:-.3px; }
  h2 { margin:0; font-size:18px; letter-spacing:-.1px; }
  .mut { color:var(--mut); font-size:13px; }
  .hero { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin:6px 0 12px; }
  .hero input[type=date] { width:auto; min-height:38px; font-size:14px; border-radius:999px; padding:0 12px; background:var(--card); }
  .days { display:flex; gap:8px; margin:0 0 12px; }
  .days button { flex:1; min-height:44px; border-radius:14px; font-weight:700; font-size:16px; background:var(--card); color:var(--mut); border:1px solid var(--line); }
  .days button.on { background:linear-gradient(135deg,var(--acc),var(--acc2)); color:var(--accfg); border-color:transparent; box-shadow:0 6px 18px -6px rgba(61,220,151,.6); }
  .pbar { height:8px; border-radius:99px; background:var(--card2); overflow:hidden; }
  .pbar i { display:block; height:100%; background:linear-gradient(90deg,var(--acc),var(--acc2)); border-radius:99px; transition:width .35s ease; }
  .ptxt { margin:6px 2px 14px; }
  .card { background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin:12px 0; box-shadow:0 10px 24px -16px rgba(0,0,0,.8); }
  .chead { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .alldone { width:26px; height:26px; border-radius:50%; background:var(--acc); color:var(--accfg); display:grid; place-items:center; font-weight:800; font-size:15px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 2px; }
  .chip { background:#0f141a; border:1px solid var(--line); border-radius:99px; padding:3px 10px; font-size:12.5px; color:var(--mut); }
  .badge { display:inline-block; background:rgba(242,184,75,.16); color:var(--warn); border:1px solid rgba(242,184,75,.4); border-radius:99px; padding:3px 10px; font-size:12.5px; font-weight:700; margin-top:8px; }
  .prev { color:var(--mut); font-size:13px; margin-top:6px; }
  .rowhead { display:flex; gap:8px; margin:12px 0 2px; color:var(--mut); font-size:12px; text-align:center; }
  .rowhead span:nth-child(1) { width:26px; } .rowhead span:nth-child(2), .rowhead span:nth-child(3) { flex:1 1 0; } .rowhead span:nth-child(4) { width:48px; } .rowhead span:nth-child(5) { width:40px; }
  .row { display:flex; gap:8px; align-items:center; margin:8px 0; }
  .row .n { width:26px; color:var(--mut); text-align:center; font-weight:700; }
  input, select, button { font:inherit; }
  input[type=number], input[type=text], input[type=date], select { min-height:50px; background:#0e1218; color:var(--txt); border:1.5px solid var(--line); border-radius:14px; padding:0 12px; width:100%; transition:border-color .15s, box-shadow .15s; }
  input:focus, select:focus { outline:0; border-color:var(--acc); box-shadow:0 0 0 3px rgba(61,220,151,.18); }
  .row input[type=number] { flex:1 1 0; min-width:0; width:auto; text-align:center; font-size:21px; font-weight:700; font-variant-numeric:tabular-nums; }
  .row input::placeholder { color:#46515f; font-weight:500; }
  select { margin-top:10px; }
  button { cursor:pointer; transition:transform .1s, background .15s, opacity .15s; }
  button:active { transform:scale(.94); }
  button.b { min-height:46px; padding:0 16px; background:var(--card2); color:var(--txt); border:1px solid var(--line); border-radius:14px; font-weight:600; }
  button.p { background:linear-gradient(135deg,var(--acc),var(--acc2)); color:var(--accfg); border:0; font-weight:800; font-size:17px; width:100%; margin-top:10px; min-height:54px; border-radius:16px; box-shadow:0 10px 22px -10px rgba(61,220,151,.7); }
  button.x { min-width:40px; width:40px; padding:0; color:var(--mut); background:transparent; border-color:transparent; font-size:16px; }
  button.ok { width:48px; min-width:48px; height:48px; border-radius:50%; padding:0; font-size:20px; font-weight:800; color:var(--mut); background:#0e1218; border:2px solid var(--line); }
  button.ok.on { background:var(--acc); color:var(--accfg); border-color:var(--acc); box-shadow:0 0 0 4px rgba(61,220,151,.18); }
  .row.done input { border-color:rgba(61,220,151,.55); background:rgba(61,220,151,.07); }
  .addrow { display:flex; gap:8px; margin-top:10px; } .addrow .b { flex:1; }
  .ghost { width:100%; margin:6px 0 12px; border:1.5px dashed var(--line) !important; background:transparent !important; color:var(--mut) !important; }
  .msg { padding:12px 14px; border-radius:14px; margin:8px 0; background:rgba(61,220,151,.13); border:1px solid rgba(61,220,151,.35); animation:slide .25s ease; }
  .msg.err { background:rgba(240,90,90,.13); border-color:rgba(240,90,90,.4); }
  @keyframes slide { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
  label.chk { display:flex; gap:10px; align-items:center; min-height:46px; }
  input[type=checkbox] { width:22px; height:22px; accent-color:var(--acc); }
  .hid { opacity:.45; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
  .tile { background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line); border-radius:var(--r); padding:14px; }
  .tile b { display:block; font-size:28px; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }
  .tile .up { color:var(--acc); } .tile .down { color:#f0777a; }
  svg text { fill:var(--mut); font-size:10px; }
  #timer { position:sticky; top:8px; z-index:5; display:flex; gap:10px; align-items:center; margin:8px 12px 0; max-width:536px; background:rgba(21,26,33,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:20px; padding:10px 12px; box-shadow:0 14px 30px -14px #000; }
  @media (min-width:584px) { #timer { margin-left:auto; margin-right:auto; } }
  #timer[hidden] { display:none; }
  #timer .ring { --p:0; position:relative; width:64px; height:64px; border-radius:50%; flex:none; background:conic-gradient(var(--acc) calc(var(--p) * 1%), #2a3340 0); display:grid; place-items:center; }
  #timer .ring::before { content:""; position:absolute; inset:5px; border-radius:50%; background:var(--card); }
  #timer .t { position:relative; font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
  #timer.reached .ring { background:var(--acc); } #timer.reached .t { color:var(--acc); }
  #timer .info { flex:1; min-width:0; } #timer .info .lbl { font-size:12px; color:var(--mut); margin-bottom:4px; }
  #timer .tg { display:flex; gap:6px; }
  #timer .tg button { min-height:34px; padding:0 12px; border-radius:99px; font-size:14px; }
  #timer button.on { background:var(--acc); color:var(--accfg); border-color:var(--acc); }
  #timer .stop { min-height:38px; padding:0 14px; }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:rgba(15,19,25,.94); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; min-height:62px; background:none; border:0; color:var(--mut); font-size:12px; font-weight:600; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  nav button svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  nav button.on { color:var(--acc); }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div id="timer" hidden></div>
<main id="app"></main>
<nav id="nav"></nav>
<script src="plan.js"></script>
<script src="logic.js"></script>
<script>
'use strict';
const KEY = 'workoutlog.v1';
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const todayStr = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };

/* ---------- storage ---------- */
function seed() { return { version: 1, plan: JSON.parse(JSON.stringify(PLAN)), sessions: [] }; }
let loadWarning = null;
function loadStore() {
  let raw = null;
  try {
    raw = localStorage.getItem(KEY);
    if (raw) { const r = Logic.validateImport(JSON.parse(raw)); if (r.ok) return r.store; }
  } catch (e) { /* fall through */ }
  if (raw) {
    try { localStorage.setItem(KEY + '.corrupt-' + Date.now(), raw); } catch (e) { /* storage full */ }
    loadWarning = 'ข้อมูลเดิมในเครื่องอ่านไม่ได้ จึงเริ่มใหม่ และเก็บสำเนาข้อมูลเดิมไว้ที่คีย์ ' + KEY + '.corrupt-* กรุณานำเข้าไฟล์สำรองถ้ามี';
  }
  return seed();
}
function saveStore(s) { localStorage.setItem(KEY, JSON.stringify(s)); }

/* ---------- plan helpers ---------- */
function addExercise(store, dayNum, spec, permanent) {
  const reuse = Logic.idForName(store.plan, store.sessions, spec.name);
  const ex = { id: reuse || (permanent ? 'c-' : 'x-') + Date.now(), name: spec.name.trim(), sets: spec.sets, repMin: spec.repMin, repMax: spec.repMax };
  if (permanent) store.plan.find((d) => d.day === dayNum).exercises.push(ex);
  return ex;
}
function findExercise(store, id) { for (const d of store.plan) for (const e of d.exercises) if (e.id === id) return e; return null; }
function renameExercise(store, id, name) { const e = findExercise(store, id); if (e && name.trim()) e.name = name.trim(); }
function setHidden(store, id, hidden) { const e = findExercise(store, id); if (e) e.hidden = hidden; }
function nameOf(store, id) {
  for (const d of store.plan) for (const e of d.exercises) {
    if (e.id === id) return e.name;
    for (const a of e.alts || []) if (a.id === id) return a.name;
  }
  for (let i = store.sessions.length - 1; i >= 0; i--) { const en = store.sessions[i].entries.find((x) => x.exerciseId === id); if (en) return en.name; }
  return id;
}

/* ---------- state ---------- */
let store = loadStore();
const DRAFT_KEY = 'workoutlog.v1.draft';
const ui = { tab: 'today', date: todayStr(), day: nextDay(), drafts: {}, extras: [], cardio: { done: false, minutes: '' }, msg: loadWarning ? { text: loadWarning, err: true } : null, progressId: null, adding: false };
function saveDraft() {
  try {
    if (hasDraft() || ui.rest.start !== null) localStorage.setItem(DRAFT_KEY, JSON.stringify({ day: ui.day, date: ui.date, drafts: ui.drafts, extras: ui.extras, cardio: ui.cardio, restStart: ui.rest.start, restTarget: ui.rest.target }));
    else localStorage.removeItem(DRAFT_KEY);
  } catch (e) { /* storage full: draft just isn't persisted */ }
}
function hasDraft() {
  return ui.extras.length > 0 || ui.cardio.done || String(ui.cardio.minutes) !== '' ||
    Object.values(ui.drafts).some((d) => d.altId || d.sets.some((x) => String(x.kg) !== '' || String(x.reps) !== ''));
}
function restoreDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (d && store.plan.some((x) => x.day === d.day) && d.drafts && Array.isArray(d.extras) && d.cardio) {
      ui.day = d.day; ui.date = d.date || ui.date; ui.drafts = d.drafts; ui.extras = d.extras; ui.cardio = d.cardio; ui.rest.start = Number.isFinite(d.restStart) ? d.restStart : null; ui.rest.target = [60, 90, 120].includes(d.restTarget) ? d.restTarget : 90;
      ui.msg = ui.msg || { text: 'กู้คืนเซสชันที่ยังไม่ได้บันทึกแล้ว', err: false };
    }
  } catch (e) { localStorage.removeItem(DRAFT_KEY); }
}
ui.rest = { start: null, target: 90 };
restoreDraft();
function renderTimer() {
  const el = document.getElementById('timer');
  if (ui.rest.start === null) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<div class="ring" id="ring"><span class="t" id="tt"></span></div><div class="info"><div class="lbl">เวลาพัก · เป้า (วินาที)</div><div class="tg">${[60, 90, 120].map((n) => `<button class="b${ui.rest.target === n ? ' on' : ''}" data-target="${n}">${n}</button>`).join('')}</div></div><button class="b stop" data-act="stoprest">หยุด</button>`;
  tickTimer();
}
function tickTimer() {
  if (ui.rest.start === null) return;
  const el = document.getElementById('timer'), tt = document.getElementById('tt'), ms = Date.now() - ui.rest.start;
  if (tt) tt.textContent = Logic.formatTimer(ms);
  const ring = document.getElementById('ring');
  if (ring) ring.style.setProperty('--p', Math.min(100, (ms / (ui.rest.target * 10))).toFixed(1));
  el.classList.toggle('reached', Logic.restReached(ms, ui.rest.target));
}
setInterval(tickTimer, 500);
document.addEventListener('visibilitychange', tickTimer);
function nextDay() {
  const last = store.sessions[store.sessions.length - 1];
  return last ? (last.day % 5) + 1 : 1;
}
const dayObj = () => store.plan.find((d) => d.day === ui.day);
const draftOf = (e) => (ui.drafts[e.id] = ui.drafts[e.id] || { altId: null, sets: Array.from({ length: e.sets }, () => ({ kg: '', reps: '', done: false })) });
const effective = (e) => { const d = draftOf(e); const a = (e.alts || []).find((x) => x.id === d.altId); return a ? { id: a.id, name: a.name } : { id: e.id, name: e.name }; };
const visibleExercises = () => [...dayObj().exercises.filter((e) => !e.hidden), ...ui.extras.filter((e) => e.day === ui.day)];

/* ---------- views ---------- */
function exerciseCard(e) {
  const d = draftOf(e), eff = effective(e);
  const prev = Logic.previousEntry(store.sessions, eff.id, ui.date);
  const prevTxt = prev ? `ครั้งก่อน (${esc(prev.date)}): ${prev.sets.map((s) => esc(s.kg) + '×' + esc(s.reps)).join(', ')}` : 'ยังไม่มีประวัติ';
  const inc = prev && Logic.shouldIncrease(prev.sets, e.repMax, e.sets);
  const alts = e.alts ? `<select data-alt="${esc(e.id)}">${[`<option value="">${esc(e.name)} (เลือกท่า)</option>`, ...e.alts.map((a) => `<option value="${esc(a.id)}"${d.altId === a.id ? ' selected' : ''}>${esc(a.name)}</option>`)].join('')}</select>` : '';
  const rows = d.sets.map((s, i) => `<div class="row${s.done ? ' done' : ''}"><span class="n">${i + 1}</span>
    <input type="number" inputmode="decimal" step="any" placeholder="${prev && prev.sets[i] ? prev.sets[i].kg : 'กก.'}" value="${esc(s.kg)}" data-set="${esc(e.id)}:${i}:kg">
    <input type="number" inputmode="numeric" step="any" placeholder="${prev && prev.sets[i] ? prev.sets[i].reps : 'ครั้ง'}" value="${esc(s.reps)}" data-set="${esc(e.id)}:${i}:reps">
    <button class="b x ok${s.done ? ' on' : ''}" data-done="${esc(e.id)}:${i}" aria-label="ทำเซ็ตนี้เสร็จ">✓</button>
    <button class="b x" data-del="${esc(e.id)}:${i}" aria-label="ลบเซ็ต">✕</button></div>`).join('');
  const all = d.sets.length > 0 && d.sets.every((x) => x.done);
  return `<div class="card"><div class="chead"><h2>${esc(eff.name)}</h2>${all ? '<span class="alldone">✓</span>' : ''}</div>
    <div class="chips"><span class="chip">เป้าหมาย ${esc(e.sets)} × ${esc(e.repMin)}–${esc(e.repMax)}</span></div>
    <div class="prev">${prevTxt}</div>${inc ? '<span class="badge">▲ ลองเพิ่มน้ำหนัก</span>' : ''}
    ${alts}
    <div class="rowhead"><span>เซ็ต</span><span>กก.</span><span>ครั้ง</span><span></span><span></span></div>${rows}
    <div class="addrow"><button class="b" data-add="${esc(e.id)}">+ เซ็ต</button>${prev ? `<button class="b" data-usePrev="${esc(e.id)}">ใช้ค่าครั้งก่อน</button>` : ''}</div></div>`;
}
function addForm() {
  return `<div class="card"><h2>เพิ่มท่า</h2>
    <div class="row"><input type="text" id="nx-name" placeholder="ชื่อท่า"></div>
    <div class="row"><input type="number" id="nx-sets" value="3" aria-label="เซ็ต"><input type="number" id="nx-min" value="8" aria-label="ต่ำสุด"><input type="number" id="nx-max" value="12" aria-label="สูงสุด"></div>
    <label class="chk"><input type="checkbox" id="nx-perm"> เพิ่มถาวรในวันนี้</label>
    <div class="addrow"><button class="b" data-act="addconfirm">เพิ่ม</button><button class="b" data-act="addcancel">ยกเลิก</button></div></div>`;
}
function viewToday() {
  const d = dayObj();
  return `${ui.msg ? `<div class="msg${ui.msg.err ? ' err' : ''}">${esc(ui.msg.text)}</div>` : ''}
  <div class="hero"><div><div class="mut">วันที่ ${d.day} จาก 5</div><h1>${esc(d.title)}</h1></div><input type="date" id="date" value="${esc(ui.date)}"></div>
  <div class="days">${store.plan.map((x) => `<button class="${x.day === ui.day ? 'on' : ''}" data-day="${x.day}">${x.day}</button>`).join('')}</div>
  ${(() => { const all = visibleExercises().flatMap((e) => draftOf(e).sets), n = all.filter((x) => x.done).length; return `<div class="pbar"><i style="width:${all.length ? Math.round((100 * n) / all.length) : 0}%"></i></div><div class="mut ptxt">ทำแล้ว ${n} / ${all.length} เซ็ต</div>`; })()}
  ${visibleExercises().map(exerciseCard).join('')}
  ${ui.adding ? addForm() : '<button class="b ghost" data-act="addopen">+ เพิ่มท่า</button>'}
  <div class="card"><h2>คาร์ดิโอ</h2><div class="mut">${esc(d.cardio.label)} ${esc(d.cardio.minutes)} นาที</div>
    <label class="chk"><input type="checkbox" id="cardio-done"${ui.cardio.done ? ' checked' : ''}> ทำแล้ว</label>
    <div class="row"><input type="number" id="cardio-min" placeholder="นาที" value="${esc(ui.cardio.minutes)}"></div></div>
  <button class="b p" data-act="save">บันทึกเซสชัน</button>`;
}

const fmtNum = (n) => String(Math.round(n * 10) / 10);
function lineChartSvg(points, unit) {
  if (!points.length) return '<div class="mut">ยังไม่มีข้อมูล</div>';
  const W = 320, H = 160, L = 36, R = 10, T = 14, B = 26;
  const max = Math.max(...points.map((p) => p.value)), min = Math.min(...points.map((p) => p.value), 0);
  const span = max - min || 1;
  const x = (i) => (points.length === 1 ? (L + W - R) / 2 : L + (i * (W - L - R)) / (points.length - 1));
  const y = (v) => T + (H - T - B) * (1 - (v - min) / span);
  const line = points.map((p, i) => `${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(unit)}">
    <line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" stroke="#2c343f"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H - B}" stroke="#2c343f"/>
    <text x="2" y="${T + 4}">${fmtNum(max)}</text><text x="2" y="${H - B}">${fmtNum(min)}</text>
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ddc97" stop-opacity=".35"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/></linearGradient></defs>
    <polygon fill="url(#ag)" points="${x(0).toFixed(1)},${H - B} ${line} ${x(points.length - 1).toFixed(1)},${H - B}"/>
    <polyline fill="none" stroke="#3ddc97" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${line}"/>
    ${points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.value)}" r="4" fill="#0b0e12" stroke="#3ddc97" stroke-width="2"/><text x="${x(i)}" y="${y(p.value) - 9}" text-anchor="middle">${fmtNum(p.value)}</text><text x="${x(i)}" y="${H - 10}" text-anchor="middle">${esc(p.label.slice(5))}</text>`).join('')}</svg>`;
}
function viewProgress() {
  const ids = new Set();
  store.plan.forEach((d) => d.exercises.forEach((e) => { ids.add(e.id); (e.alts || []).forEach((a) => ids.add(a.id)); }));
  store.sessions.forEach((s) => s.entries.forEach((e) => ids.add(e.exerciseId)));
  const withData = [...ids].filter((id) => store.sessions.some((s) => s.entries.some((e) => e.exerciseId === id)));
  const list = withData.length ? withData : [];
  if (!list.includes(ui.progressId)) ui.progressId = list[0] || null;
  if (!ui.progressId) return '<div class="card">ยังไม่มีข้อมูล บันทึกเซสชันแรกในแท็บ "วันนี้" ก่อนนะ</div>';
  const stats = Logic.weeklyStats(store.sessions, ui.progressId);
  const last = stats[stats.length - 1], before = stats[stats.length - 2];
  const sg = (n) => (n >= 0 ? '+' : '') + fmtNum(n);
  const cls = (n) => (n > 0 ? 'up' : n < 0 ? 'down' : '');
  const tiles = `<div class="tiles"><div class="tile"><div class="mut">น้ำหนักสูงสุดล่าสุด</div><b>${fmtNum(last.topKg)} <small class="mut">กก.</small></b>${before ? `<span class="${cls(last.topKg - before.topKg)}">${sg(last.topKg - before.topKg)} กก. จากสัปดาห์ก่อน</span>` : '<span class="mut">สัปดาห์แรก</span>'}</div>
    <div class="tile"><div class="mut">ปริมาณรวมล่าสุด</div><b>${fmtNum(last.volume)}</b>${before ? `<span class="${cls(last.volume - before.volume)}">${sg(last.volume - before.volume)} จากสัปดาห์ก่อน</span>` : '<span class="mut">สัปดาห์แรก</span>'}</div></div>`;
  return `<div class="row"><select id="prog-sel">${list.map((id) => `<option value="${esc(id)}"${id === ui.progressId ? ' selected' : ''}>${esc(nameOf(store, id))}</option>`).join('')}</select></div>
  ${tiles}
  <div class="card"><h2>น้ำหนักสูงสุด (กก.)</h2>${lineChartSvg(stats.map((s) => ({ label: s.week, value: s.topKg })), 'กก.')}</div>
  <div class="card"><h2>ปริมาณรวม (กก. × ครั้ง)</h2>${lineChartSvg(stats.map((s) => ({ label: s.week, value: s.volume })), 'ปริมาณ')}</div>
`;
}
function viewSettings() {
  return `${ui.msg ? `<div class="msg${ui.msg.err ? ' err' : ''}">${esc(ui.msg.text)}</div>` : ''}
  ${store.plan.map((d) => `<div class="card"><h2>วันที่ ${d.day}: ${esc(d.title)}</h2>
    ${d.exercises.map((e) => `<div class="row${e.hidden ? ' hid' : ''}"><div style="flex:1">${esc(e.name)}</div>
      <button class="b" data-rename="${esc(e.id)}">แก้ชื่อ</button><button class="b" data-hide="${esc(e.id)}">${e.hidden ? 'แสดง' : 'ซ่อน'}</button></div>`).join('')}</div>`).join('')}
  <div class="card"><h2>เซสชันที่บันทึกไว้</h2>${store.sessions.length ? store.sessions.slice(-20).reverse().map((s) => `<div class="row"><div style="flex:1">${esc(s.date)} · วันที่ ${esc(s.day)} · ${s.entries.length} ท่า</div><button class="b" data-delsession="${esc(s.id)}">ลบ</button></div>`).join('') : '<div class="mut">ยังไม่มี</div>'}</div>
  <div class="card"><h2>สำรองข้อมูล</h2><div class="mut">ข้อมูลเก็บในเบราว์เซอร์นี้เท่านั้น ควรส่งออกไฟล์สำรองเป็นระยะ</div>
    <button class="b p" data-act="export">ส่งออกข้อมูล</button>
    <button class="b p" data-act="import">นำเข้าข้อมูล</button><input type="file" id="import-file" accept="application/json,.json" hidden></div>`;
}

function render() {
  const view = ui.tab === 'today' ? viewToday() : ui.tab === 'progress' ? viewProgress() : viewSettings();
  document.getElementById('app').innerHTML = view;
  renderTimer();
  saveDraft();
  document.getElementById('nav').innerHTML = [['today', 'วันนี้', '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>'], ['progress', 'ความก้าวหน้า', '<path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/>'], ['settings', 'ตั้งค่า', '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>']]
    .map(([k, t, ic]) => `<button class="${ui.tab === k ? 'on' : ''}" data-tab="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg><span>${t}</span></button>`).join('');
}

/* ---------- actions ---------- */
function say(text, err) { ui.msg = { text, err: !!err }; }
function exById(id) { return visibleExercises().find((e) => e.id === id); }

function saveSession() {
  const partial = visibleExercises().reduce((n, e) => n + Logic.partialSets(draftOf(e).sets), 0);
  if (partial) { say(`มี ${partial} เซ็ตที่กรอกไม่ครบ (ต้องมีทั้งกก.และครั้ง; ท่าน้ำหนักตัวใส่ 0 กก.) ยังไม่ได้บันทึก`, true); return; }
  const entries = [];
  for (const e of visibleExercises()) {
    const eff = effective(e), sets = Logic.cleanSets(draftOf(e).sets);
    if (sets.length) entries.push({ exerciseId: eff.id, name: eff.name, sets });
  }
  const minutes = Number(String(ui.cardio.minutes).replace(',', '.')) || 0;
  if (!entries.length && !ui.cardio.done) { say('ยังไม่มีเซ็ตที่กรอก จึงไม่ได้บันทึก', true); return; }
  store.sessions.push({ id: 's-' + Date.now(), date: ui.date, day: ui.day, entries, cardio: { done: ui.cardio.done, minutes } });
  try { saveStore(store); } catch (e) { store.sessions.pop(); say('บันทึกไม่สำเร็จ (พื้นที่เก็บข้อมูลเต็มหรือถูกบล็อก) ลองส่งออกข้อมูลแล้วล้างพื้นที่', true); return; }
  ui.drafts = {}; ui.extras = []; ui.cardio = { done: false, minutes: '' }; ui.rest.start = null;
  say('บันทึกแล้ว ✓');
}

function exportData() {
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `workout-log-${todayStr()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let obj;
    try { obj = JSON.parse(fr.result); } catch (e) { say('ไฟล์ไม่ถูกต้อง: อ่านเป็น JSON ไม่ได้', true); render(); return; }
    const r = Logic.validateImport(obj);
    if (!r.ok) { say(r.error, true); render(); return; }
    if (!confirm('นำเข้าจะแทนที่ข้อมูลปัจจุบันทั้งหมด ดำเนินการต่อไหม?')) return;
    store = r.store; saveStore(store); ui.drafts = {}; ui.extras = [];
    say('นำเข้าข้อมูลแล้ว ✓'); render();
  };
  fr.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button'); if (!t) return;
  const ds = t.dataset;
  if (ds.tab) { ui.tab = ds.tab; ui.msg = null; }
  else if (ds.day) {
    if (Number(ds.day) !== ui.day) {
      if (hasDraft() && !confirm('เปลี่ยนวันจะล้างข้อมูลที่ยังไม่ได้บันทึก ดำเนินการต่อไหม?')) return;
      ui.day = Number(ds.day); ui.drafts = {}; ui.extras = []; ui.cardio = { done: false, minutes: '' }; ui.msg = null;
    }
  }
  else if (ds.done) {
    const [id, i] = ds.done.split(':'), e = exById(id), row = draftOf(e).sets[Number(i)];
    if (row.done) row.done = false;
    else {
      const empty = (v) => String(v) === '';
      if (empty(row.kg) && empty(row.reps)) {
        const prev = Logic.previousEntry(store.sessions, effective(e).id, ui.date);
        const src = prev && (prev.sets[Number(i)] || prev.sets[prev.sets.length - 1]);
        if (!src) { say('กรอกกก.และครั้งก่อนกดเสร็จ (ยังไม่มีค่าครั้งก่อนให้เติม)', true); render(); return; }
        row.kg = src.kg; row.reps = src.reps;
      } else if (Logic.partialSets([row])) { say('กรอกกก.และครั้งให้ครบก่อนกดเสร็จ', true); render(); return; }
      row.done = true; ui.rest.start = Date.now(); ui.msg = null;
    }
  }
  else if (ds.target) ui.rest.target = Number(ds.target);
  else if (ds.act === 'stoprest') ui.rest.start = null;
  else if (ds.add) { const d = draftOf(exById(ds.add)); const l = d.sets[d.sets.length - 1]; d.sets.push({ kg: l ? l.kg : '', reps: l ? l.reps : '', done: false }); }
  else if (ds.del) { const [id, i] = ds.del.split(':'); draftOf(exById(id)).sets.splice(Number(i), 1); }
  else if (ds.useprev) {
    const e = exById(ds.useprev), prev = Logic.previousEntry(store.sessions, effective(e).id, ui.date);
    if (prev) draftOf(e).sets = prev.sets.map((s) => ({ kg: s.kg, reps: s.reps, done: false }));
  }
  else if (ds.rename) { const e = findExercise(store, ds.rename); const n = prompt('ชื่อท่าใหม่', e.name); if (n) { renameExercise(store, ds.rename, n); saveStore(store); } }
  else if (ds.hide) { const e = findExercise(store, ds.hide); setHidden(store, ds.hide, !e.hidden); saveStore(store); }
  else if (ds.delsession) {
    const i = store.sessions.findIndex((x) => x.id === ds.delsession);
    if (i >= 0 && confirm('ลบเซสชันนี้ถาวรไหม?')) { store.sessions.splice(i, 1); try { saveStore(store); } catch (e) { say('บันทึกไม่สำเร็จ', true); } }
  }
  else if (ds.act === 'addopen') ui.adding = true;
  else if (ds.act === 'addcancel') ui.adding = false;
  else if (ds.act === 'addconfirm') {
    const g = (id) => document.getElementById(id);
    const spec = { name: g('nx-name').value, sets: Number(g('nx-sets').value) || 3, repMin: Number(g('nx-min').value) || 8, repMax: Number(g('nx-max').value) || 12 };
    if (!spec.name.trim()) { say('กรุณาใส่ชื่อท่า', true); }
    else {
      const perm = g('nx-perm').checked, ex = addExercise(store, ui.day, spec, perm);
      if (perm) saveStore(store); else { ex.day = ui.day; ui.extras.push(ex); }
      ui.adding = false; ui.msg = null;
    }
  }
  else if (ds.act === 'save') saveSession();
  else if (ds.act === 'export') exportData();
  else if (ds.act === 'import') { document.getElementById('import-file').click(); return; }
  else return;
  render();
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.dataset.set) { const [id, i, f] = t.dataset.set.split(':'); draftOf(exById(id)).sets[Number(i)][f] = t.value; }
  else if (t.id === 'cardio-min') ui.cardio.minutes = t.value;
  saveDraft();
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.dataset.alt) { draftOf(exById(t.dataset.alt)).altId = t.value || null; render(); }
  else if (t.id === 'date') { ui.date = t.value || todayStr(); render(); }
  else if (t.id === 'cardio-done') { ui.cardio.done = t.checked; saveDraft(); }
  else if (t.id === 'prog-sel') { ui.progressId = t.value; render(); }
  else if (t.id === 'import-file' && t.files[0]) { importData(t.files[0]); t.value = ''; }
});
render();
</script>
</body>
</html>
