<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมุดบันทึกเวท</title>
<style>
  :root { --bg:#111418; --card:#1b2027; --line:#2c343f; --txt:#e8edf2; --mut:#8b97a5; --acc:#4cc38a; --warn:#f0b74a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.4 system-ui,-apple-system,"Sarabun",sans-serif; padding-bottom:80px; }
  main { max-width:560px; margin:0 auto; padding:12px; }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line); }
  nav button { flex:1; min-height:56px; background:none; border:0; color:var(--mut); font-size:15px; }
  nav button.on { color:var(--acc); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin:10px 0; }
  h2 { margin:0 0 4px; font-size:17px; }
  .mut { color:var(--mut); font-size:13px; }
  .badge { display:inline-block; background:var(--acc); color:#06210f; border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; margin-top:4px; }
  .row { display:flex; gap:8px; align-items:center; margin:6px 0; }
  .row .n { width:22px; color:var(--mut); text-align:center; }
  input, select, button { font:inherit; }
  input[type=number], input[type=text], input[type=date], select { min-height:44px; background:#0e1115; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:0 10px; width:100%; }
  .row input[type=number] { text-align:center; }
  button.b { min-height:44px; padding:0 14px; background:#262e38; color:var(--txt); border:1px solid var(--line); border-radius:8px; }
  button.p { background:var(--acc); color:#06210f; border-color:var(--acc); font-weight:600; width:100%; margin-top:8px; }
  button.x { min-width:44px; padding:0; }
  .days { display:flex; gap:6px; margin:8px 0; }
  .days button { flex:1; }
  .days button.on { background:var(--acc); color:#06210f; border-color:var(--acc); }
  .msg { padding:10px; border-radius:8px; margin:8px 0; background:#16382a; }
  .msg.err { background:#4a1f1f; }
  svg text { fill:var(--mut); font-size:10px; }
  .hid { opacity:.5; }
  label.chk { display:flex; gap:8px; align-items:center; min-height:44px; }
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script src="plan.js"></script>
<script src="logic.js"></script>
<script>
'use strict';
const KEY = 'workoutlog.v1';
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const todayStr = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };

/* ---------- storage ---------- */
function seed() { return { version: 1, plan: JSON.parse(JSON.stringify(PLAN)), sessions: [] }; }
let loadWarning = null;
function loadStore() {
  let raw = null;
  try {
    raw = localStorage.getItem(KEY);
    if (raw) { const r = Logic.validateImport(JSON.parse(raw)); if (r.ok) return r.store; }
  } catch (e) { /* fall through */ }
  if (raw) {
    try { localStorage.setItem(KEY + '.corrupt-' + Date.now(), raw); } catch (e) { /* storage full */ }
    loadWarning = 'ข้อมูลเดิมในเครื่องอ่านไม่ได้ จึงเริ่มใหม่ และเก็บสำเนาข้อมูลเดิมไว้ที่คีย์ ' + KEY + '.corrupt-* กรุณานำเข้าไฟล์สำรองถ้ามี';
  }
  return seed();
}
function saveStore(s) { localStorage.setItem(KEY, JSON.stringify(s)); }

/* ---------- plan helpers ---------- */
function addExercise(store, dayNum, spec, permanent) {
  const reuse = Logic.idForName(store.plan, store.sessions, spec.name);
  const ex = { id: reuse || (permanent ? 'c-' : 'x-') + Date.now(), name: spec.name.trim(), sets: spec.sets, repMin: spec.repMin, repMax: spec.repMax };
  if (permanent) store.plan.find((d) => d.day === dayNum).exercises.push(ex);
  return ex;
}
function findExercise(store, id) { for (const d of store.plan) for (const e of d.exercises) if (e.id === id) return e; return null; }
function renameExercise(store, id, name) { const e = findExercise(store, id); if (e && name.trim()) e.name = name.trim(); }
function setHidden(store, id, hidden) { const e = findExercise(store, id); if (e) e.hidden = hidden; }
function nameOf(store, id) {
  for (const d of store.plan) for (const e of d.exercises) {
    if (e.id === id) return e.name;
    for (const a of e.alts || []) if (a.id === id) return a.name;
  }
  for (let i = store.sessions.length - 1; i >= 0; i--) { const en = store.sessions[i].entries.find((x) => x.exerciseId === id); if (en) return en.name; }
  return id;
}

/* ---------- state ---------- */
let store = loadStore();
const DRAFT_KEY = 'workoutlog.v1.draft';
const ui = { tab: 'today', date: todayStr(), day: nextDay(), drafts: {}, extras: [], cardio: { done: false, minutes: '' }, msg: loadWarning ? { text: loadWarning, err: true } : null, progressId: null, adding: false };
function saveDraft() {
  try {
    if (hasDraft()) localStorage.setItem(DRAFT_KEY, JSON.stringify({ day: ui.day, date: ui.date, drafts: ui.drafts, extras: ui.extras, cardio: ui.cardio }));
    else localStorage.removeItem(DRAFT_KEY);
  } catch (e) { /* storage full: draft just isn't persisted */ }
}
function hasDraft() {
  return ui.extras.length > 0 || ui.cardio.done || String(ui.cardio.minutes) !== '' ||
    Object.values(ui.drafts).some((d) => d.altId || d.sets.some((x) => String(x.kg) !== '' || String(x.reps) !== ''));
}
function restoreDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (d && store.plan.some((x) => x.day === d.day) && d.drafts && Array.isArray(d.extras) && d.cardio) {
      ui.day = d.day; ui.date = d.date || ui.date; ui.drafts = d.drafts; ui.extras = d.extras; ui.cardio = d.cardio;
      ui.msg = ui.msg || { text: 'กู้คืนเซสชันที่ยังไม่ได้บันทึกแล้ว', err: false };
    }
  } catch (e) { localStorage.removeItem(DRAFT_KEY); }
}
restoreDraft();
function nextDay() {
  const last = store.sessions[store.sessions.length - 1];
  return last ? (last.day % 5) + 1 : 1;
}
const dayObj = () => store.plan.find((d) => d.day === ui.day);
const draftOf = (e) => (ui.drafts[e.id] = ui.drafts[e.id] || { altId: null, sets: Array.from({ length: e.sets }, () => ({ kg: '', reps: '' })) });
const effective = (e) => { const d = draftOf(e); const a = (e.alts || []).find((x) => x.id === d.altId); return a ? { id: a.id, name: a.name } : { id: e.id, name: e.name }; };
const visibleExercises = () => [...dayObj().exercises.filter((e) => !e.hidden), ...ui.extras.filter((e) => e.day === ui.day)];

/* ---------- views ---------- */
function exerciseCard(e) {
  const d = draftOf(e), eff = effective(e);
  const prev = Logic.previousEntry(store.sessions, eff.id, ui.date);
  const prevTxt = prev ? `ครั้งก่อน (${esc(prev.date)}): ${prev.sets.map((s) => esc(s.kg) + '×' + esc(s.reps)).join(', ')}` : 'ยังไม่มีประวัติ';
  const inc = prev && Logic.shouldIncrease(prev.sets, e.repMax, e.sets);
  const alts = e.alts ? `<select data-alt="${esc(e.id)}">${[`<option value="">${esc(e.name)} (เลือกท่า)</option>`, ...e.alts.map((a) => `<option value="${esc(a.id)}"${d.altId === a.id ? ' selected' : ''}>${esc(a.name)}</option>`)].join('')}</select>` : '';
  const rows = d.sets.map((s, i) => `<div class="row"><span class="n">${i + 1}</span>
    <input type="number" inputmode="decimal" step="any" placeholder="${prev && prev.sets[i] ? prev.sets[i].kg : 'กก.'}" value="${esc(s.kg)}" data-set="${esc(e.id)}:${i}:kg">
    <input type="number" inputmode="numeric" step="any" placeholder="${prev && prev.sets[i] ? prev.sets[i].reps : 'ครั้ง'}" value="${esc(s.reps)}" data-set="${esc(e.id)}:${i}:reps">
    <button class="b x" data-del="${esc(e.id)}:${i}" aria-label="ลบเซ็ต">✕</button></div>`).join('');
  return `<div class="card"><h2>${esc(eff.name)}</h2>
    <div class="mut">เป้าหมาย ${esc(e.sets)} × ${esc(e.repMin)}–${esc(e.repMax)}</div>
    <div class="mut">${prevTxt}</div>${inc ? '<span class="badge">ลองเพิ่มน้ำหนัก</span>' : ''}
    ${alts}${rows}
    <div class="row"><button class="b" data-add="${esc(e.id)}">+ เซ็ต</button>${prev ? `<button class="b" data-usePrev="${esc(e.id)}">ใช้ค่าครั้งก่อน</button>` : ''}</div></div>`;
}
function addForm() {
  return `<div class="card"><h2>เพิ่มท่า</h2>
    <div class="row"><input type="text" id="nx-name" placeholder="ชื่อท่า"></div>
    <div class="row"><input type="number" id="nx-sets" value="3" aria-label="เซ็ต"><input type="number" id="nx-min" value="8" aria-label="ต่ำสุด"><input type="number" id="nx-max" value="12" aria-label="สูงสุด"></div>
    <label class="chk"><input type="checkbox" id="nx-perm"> เพิ่มถาวรในวันนี้</label>
    <div class="row"><button class="b" data-act="addconfirm">เพิ่ม</button><button class="b" data-act="addcancel">ยกเลิก</button></div></div>`;
}
function viewToday() {
  const d = dayObj();
  return `${ui.msg ? `<div class="msg${ui.msg.err ? ' err' : ''}">${esc(ui.msg.text)}</div>` : ''}
  <div class="row"><input type="date" id="date" value="${esc(ui.date)}"></div>
  <div class="days">${store.plan.map((x) => `<button class="b${x.day === ui.day ? ' on' : ''}" data-day="${x.day}">${x.day}</button>`).join('')}</div>
  <div class="mut">วันที่ ${d.day}: ${esc(d.title)}</div>
  ${visibleExercises().map(exerciseCard).join('')}
  ${ui.adding ? addForm() : '<button class="b" data-act="addopen" style="width:100%">+ เพิ่มท่า</button>'}
  <div class="card"><h2>คาร์ดิโอ</h2><div class="mut">${esc(d.cardio.label)} ${esc(d.cardio.minutes)} นาที</div>
    <label class="chk"><input type="checkbox" id="cardio-done"${ui.cardio.done ? ' checked' : ''}> ทำแล้ว</label>
    <div class="row"><input type="number" id="cardio-min" placeholder="นาที" value="${esc(ui.cardio.minutes)}"></div></div>
  <button class="b p" data-act="save">บันทึกเซสชัน</button>`;
}

function lineChartSvg(points, unit) {
  if (!points.length) return '<div class="mut">ยังไม่มีข้อมูล</div>';
  const W = 320, H = 160, L = 36, R = 10, T = 14, B = 26;
  const max = Math.max(...points.map((p) => p.value)), min = Math.min(...points.map((p) => p.value), 0);
  const span = max - min || 1;
  const x = (i) => (points.length === 1 ? (L + W - R) / 2 : L + (i * (W - L - R)) / (points.length - 1));
  const y = (v) => T + (H - T - B) * (1 - (v - min) / span);
  const line = points.map((p, i) => `${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(unit)}">
    <line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" stroke="#2c343f"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H - B}" stroke="#2c343f"/>
    <text x="2" y="${T + 4}">${Math.round(max)}</text><text x="2" y="${H - B}">${Math.round(min)}</text>
    <polyline fill="none" stroke="#4cc38a" stroke-width="2" points="${line}"/>
    ${points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.value)}" r="3.5" fill="#4cc38a"/><text x="${x(i)}" y="${y(p.value) - 7}" text-anchor="middle">${Math.round(p.value)}</text><text x="${x(i)}" y="${H - 10}" text-anchor="middle">${esc(p.label.slice(5))}</text>`).join('')}</svg>`;
}
function viewProgress() {
  const ids = new Set();
  store.plan.forEach((d) => d.exercises.forEach((e) => { ids.add(e.id); (e.alts || []).forEach((a) => ids.add(a.id)); }));
  store.sessions.forEach((s) => s.entries.forEach((e) => ids.add(e.exerciseId)));
  const withData = [...ids].filter((id) => store.sessions.some((s) => s.entries.some((e) => e.exerciseId === id)));
  const list = withData.length ? withData : [];
  if (!list.includes(ui.progressId)) ui.progressId = list[0] || null;
  if (!ui.progressId) return '<div class="card">ยังไม่มีข้อมูล บันทึกเซสชันแรกในแท็บ "วันนี้" ก่อนนะ</div>';
  const stats = Logic.weeklyStats(store.sessions, ui.progressId);
  const last = stats[stats.length - 1], before = stats[stats.length - 2];
  const diff = before ? `สัปดาห์ล่าสุดเทียบก่อนหน้า: น้ำหนักสูงสุด ${last.topKg - before.topKg >= 0 ? '+' : ''}${last.topKg - before.topKg} กก., ปริมาณรวม ${last.volume - before.volume >= 0 ? '+' : ''}${last.volume - before.volume}` : '';
  return `<div class="row"><select id="prog-sel">${list.map((id) => `<option value="${esc(id)}"${id === ui.progressId ? ' selected' : ''}>${esc(nameOf(store, id))}</option>`).join('')}</select></div>
  <div class="card"><h2>น้ำหนักสูงสุด (กก.)</h2>${lineChartSvg(stats.map((s) => ({ label: s.week, value: s.topKg })), 'กก.')}</div>
  <div class="card"><h2>ปริมาณรวม (กก. × ครั้ง)</h2>${lineChartSvg(stats.map((s) => ({ label: s.week, value: s.volume })), 'ปริมาณ')}</div>
  <div class="mut">${esc(diff)}</div>`;
}
function viewSettings() {
  return `${ui.msg ? `<div class="msg${ui.msg.err ? ' err' : ''}">${esc(ui.msg.text)}</div>` : ''}
  ${store.plan.map((d) => `<div class="card"><h2>วันที่ ${d.day}: ${esc(d.title)}</h2>
    ${d.exercises.map((e) => `<div class="row${e.hidden ? ' hid' : ''}"><div style="flex:1">${esc(e.name)}</div>
      <button class="b" data-rename="${esc(e.id)}">แก้ชื่อ</button><button class="b" data-hide="${esc(e.id)}">${e.hidden ? 'แสดง' : 'ซ่อน'}</button></div>`).join('')}</div>`).join('')}
  <div class="card"><h2>เซสชันที่บันทึกไว้</h2>${store.sessions.length ? store.sessions.slice(-20).reverse().map((s) => `<div class="row"><div style="flex:1">${esc(s.date)} · วันที่ ${esc(s.day)} · ${s.entries.length} ท่า</div><button class="b" data-delsession="${esc(s.id)}">ลบ</button></div>`).join('') : '<div class="mut">ยังไม่มี</div>'}</div>
  <div class="card"><h2>สำรองข้อมูล</h2><div class="mut">ข้อมูลเก็บในเบราว์เซอร์นี้เท่านั้น ควรส่งออกไฟล์สำรองเป็นระยะ</div>
    <button class="b p" data-act="export">ส่งออกข้อมูล</button>
    <button class="b p" data-act="import">นำเข้าข้อมูล</button><input type="file" id="import-file" accept="application/json,.json" hidden></div>`;
}

function render() {
  const view = ui.tab === 'today' ? viewToday() : ui.tab === 'progress' ? viewProgress() : viewSettings();
  document.getElementById('app').innerHTML = view;
  saveDraft();
  document.getElementById('nav').innerHTML = [['today', 'วันนี้'], ['progress', 'ความก้าวหน้า'], ['settings', 'ตั้งค่า']]
    .map(([k, t]) => `<button class="${ui.tab === k ? 'on' : ''}" data-tab="${k}">${t}</button>`).join('');
}

/* ---------- actions ---------- */
function say(text, err) { ui.msg = { text, err: !!err }; }
function exById(id) { return visibleExercises().find((e) => e.id === id); }

function saveSession() {
  const partial = visibleExercises().reduce((n, e) => n + Logic.partialSets(draftOf(e).sets), 0);
  if (partial) { say(`มี ${partial} เซ็ตที่กรอกไม่ครบ (ต้องมีทั้งกก.และครั้ง; ท่าน้ำหนักตัวใส่ 0 กก.) ยังไม่ได้บันทึก`, true); return; }
  const entries = [];
  for (const e of visibleExercises()) {
    const eff = effective(e), sets = Logic.cleanSets(draftOf(e).sets);
    if (sets.length) entries.push({ exerciseId: eff.id, name: eff.name, sets });
  }
  const minutes = Number(String(ui.cardio.minutes).replace(',', '.')) || 0;
  if (!entries.length && !ui.cardio.done) { say('ยังไม่มีเซ็ตที่กรอก จึงไม่ได้บันทึก', true); return; }
  store.sessions.push({ id: 's-' + Date.now(), date: ui.date, day: ui.day, entries, cardio: { done: ui.cardio.done, minutes } });
  try { saveStore(store); } catch (e) { store.sessions.pop(); say('บันทึกไม่สำเร็จ (พื้นที่เก็บข้อมูลเต็มหรือถูกบล็อก) ลองส่งออกข้อมูลแล้วล้างพื้นที่', true); return; }
  ui.drafts = {}; ui.extras = []; ui.cardio = { done: false, minutes: '' };
  say('บันทึกแล้ว ✓');
}

function exportData() {
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `workout-log-${todayStr()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let obj;
    try { obj = JSON.parse(fr.result); } catch (e) { say('ไฟล์ไม่ถูกต้อง: อ่านเป็น JSON ไม่ได้', true); render(); return; }
    const r = Logic.validateImport(obj);
    if (!r.ok) { say(r.error, true); render(); return; }
    if (!confirm('นำเข้าจะแทนที่ข้อมูลปัจจุบันทั้งหมด ดำเนินการต่อไหม?')) return;
    store = r.store; saveStore(store); ui.drafts = {}; ui.extras = [];
    say('นำเข้าข้อมูลแล้ว ✓'); render();
  };
  fr.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button'); if (!t) return;
  const ds = t.dataset;
  if (ds.tab) { ui.tab = ds.tab; ui.msg = null; }
  else if (ds.day) {
    if (Number(ds.day) !== ui.day) {
      if (hasDraft() && !confirm('เปลี่ยนวันจะล้างข้อมูลที่ยังไม่ได้บันทึก ดำเนินการต่อไหม?')) return;
      ui.day = Number(ds.day); ui.drafts = {}; ui.extras = []; ui.cardio = { done: false, minutes: '' }; ui.msg = null;
    }
  }
  else if (ds.add) { const d = draftOf(exById(ds.add)); const l = d.sets[d.sets.length - 1]; d.sets.push({ kg: l ? l.kg : '', reps: l ? l.reps : '' }); }
  else if (ds.del) { const [id, i] = ds.del.split(':'); draftOf(exById(id)).sets.splice(Number(i), 1); }
  else if (ds.useprev) {
    const e = exById(ds.useprev), prev = Logic.previousEntry(store.sessions, effective(e).id, ui.date);
    if (prev) draftOf(e).sets = prev.sets.map((s) => ({ kg: s.kg, reps: s.reps }));
  }
  else if (ds.rename) { const e = findExercise(store, ds.rename); const n = prompt('ชื่อท่าใหม่', e.name); if (n) { renameExercise(store, ds.rename, n); saveStore(store); } }
  else if (ds.hide) { const e = findExercise(store, ds.hide); setHidden(store, ds.hide, !e.hidden); saveStore(store); }
  else if (ds.delsession) {
    const i = store.sessions.findIndex((x) => x.id === ds.delsession);
    if (i >= 0 && confirm('ลบเซสชันนี้ถาวรไหม?')) { store.sessions.splice(i, 1); try { saveStore(store); } catch (e) { say('บันทึกไม่สำเร็จ', true); } }
  }
  else if (ds.act === 'addopen') ui.adding = true;
  else if (ds.act === 'addcancel') ui.adding = false;
  else if (ds.act === 'addconfirm') {
    const g = (id) => document.getElementById(id);
    const spec = { name: g('nx-name').value, sets: Number(g('nx-sets').value) || 3, repMin: Number(g('nx-min').value) || 8, repMax: Number(g('nx-max').value) || 12 };
    if (!spec.name.trim()) { say('กรุณาใส่ชื่อท่า', true); }
    else {
      const perm = g('nx-perm').checked, ex = addExercise(store, ui.day, spec, perm);
      if (perm) saveStore(store); else { ex.day = ui.day; ui.extras.push(ex); }
      ui.adding = false; ui.msg = null;
    }
  }
  else if (ds.act === 'save') saveSession();
  else if (ds.act === 'export') exportData();
  else if (ds.act === 'import') { document.getElementById('import-file').click(); return; }
  else return;
  render();
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.dataset.set) { const [id, i, f] = t.dataset.set.split(':'); draftOf(exById(id)).sets[Number(i)][f] = t.value; }
  else if (t.id === 'cardio-min') ui.cardio.minutes = t.value;
  saveDraft();
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.dataset.alt) { draftOf(exById(t.dataset.alt)).altId = t.value || null; render(); }
  else if (t.id === 'date') { ui.date = t.value || todayStr(); render(); }
  else if (t.id === 'cardio-done') { ui.cardio.done = t.checked; saveDraft(); }
  else if (t.id === 'prog-sel') { ui.progressId = t.value; render(); }
  else if (t.id === 'import-file' && t.files[0]) { importData(t.files[0]); t.value = ''; }
});
render();
</script>
</body>
</html>
